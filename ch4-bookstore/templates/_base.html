{% load static %}
<!DOCTYPE html>
<html>
    <head>
	<meta charset="utf-8">
	<title>{% block title %}Bookstore{% endblock title %}</title>
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<!-- Custom CSS -->
	<link rel="stylesheet" href="{% static 'css/base.css' %}">
    </head>
    <body>
	<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
	    <div class="container-fluid">
		<a class="navbar-brand" href="{% url 'home' %}">Bookstore</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
		    <span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="navbarCollapse">
		    <ul class="navbar-nav me-auto mb-2 mb-md-0">
			<li class="nav-item">
			    <a class="nav-link" href="{% url 'book_list' %}">Books</a>
			<li class="nav-item">
			    <a class="nav-link" href="{% url 'about' %}">About</a>
			</li>
			{% if user.is_authenticated %}
			<li class="nav-item">
			    <a class="nav-link" href="{% url 'account_logout' %}">Log Out</a>
			</li>
			<li class="nav-item">
			    <a class="nav-link" href="{% url 'account_change_password' %}">Change Password</a>
			</li>

			{% else %}
			<li class="nav-item">
			    <a class="nav-link" href="{% url 'account_login' %}">Log In</a>
			</li>
			<li class="nav-item">
			    <a class="nav-link" href="{% url 'account_signup' %}">Sign Up</a>
			</li>
			{% endif %}
		    </ul>
		    <form class="d-flex" action="{% url 'search_results' %}" method="get">
			<input class="form-control me-2" type="search" name="q" placeholder="Search" aria-label="Search" >
			<button class="btn btn-outline-success" type="submit">Search</button>
		    </form>
		</div>
	    </div>
	</nav>
	<div class="container">
	    {% block content %}
	    {% endblock content %}
	</div>
	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
	<!-- Custom JS -->
	<script src="{% static 'js/base.js' %}"></script>
    </body>
</html>
