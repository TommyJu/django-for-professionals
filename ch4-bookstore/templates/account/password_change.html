{% extends "_base.html" %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block head_title %}
    {% trans "Change Password" %}
{% endblock %}

{% block content %}
<h1>{% trans "Change Password" %}</h1>

<form method="post" action="{% url 'account_change_password' %}">
    {% csrf_token %}
    {{ redirect_field }}

    {{ form|crispy }}

    <button class="btn btn-primary" type="submit">
        {% trans "Change Password" %}
    </button>
</form>
{% endblock content %}
